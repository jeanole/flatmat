name: CI

on:
  push:
    branches: [main]
  pull_request:  # lint and tests before a merge; the results page only on main
  workflow_dispatch:  # "Run workflow" in the Actions tab, for any branch

concurrency:  # a new push to a pull request cancels its older run; main runs every push
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uvx ruff@0.6.9 check src tests
      - run: uvx ruff@0.6.9 format --check src tests

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}, OCP ${{ matrix.ocp }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # OCP 8.0: Python 3.11-3.14
          - { os: ubuntu-latest, python: "3.11", ocp: "8.0.1.1.0" }
          - { os: ubuntu-latest, python: "3.14", ocp: "8.0.1.1.0" }
          - { os: macos-latest, python: "3.13", ocp: "8.0.1.1.0" }
          - { os: windows-latest, python: "3.12", ocp: "8.0.1.1.0" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[test]" "cadquery-ocp-novtk==${{ matrix.ocp }}" mypy
      - name: Type check
        run: uv run --no-sync mypy
      - name: Fetch BenDFM samples (MIT repository; data not committed here)
        shell: bash
        run: |
          mkdir -p bendfm && cd bendfm
          for i in 0 1 2 3 4 5; do
            for f in $i.stp ${i}_unfolded.stp ${i}_sequence.json; do
              curl -sSfLO --retry 5 --retry-all-errors --retry-delay 2 \
                "https://raw.githubusercontent.com/UGent-CVAMO/bendfm/main/example_files/$f"
            done
          done
      - name: Test
        shell: bash
        env:
          FLATMAT_BENDFM_DIR: ${{ github.workspace }}/bendfm
        run: uv run --no-sync pytest -q

  results-page:
    # docs/test-results.md: the tests once more on main, written down and committed back
    # when a result changed.
    # A push with the workflow's own token starts no new run; [skip ci] says so as well.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: results-page
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[test]" "cadquery-ocp-novtk==8.0.1.1.0"
      - name: Fetch BenDFM samples (MIT repository; data not committed here)
        run: |
          mkdir -p bendfm && cd bendfm
          for i in 0 1 2 3 4 5; do
            for f in $i.stp ${i}_unfolded.stp ${i}_sequence.json; do
              curl -sSfLO --retry 5 --retry-all-errors --retry-delay 2 \
                "https://raw.githubusercontent.com/UGent-CVAMO/bendfm/main/example_files/$f"
            done
          done
      - name: Test and write the page
        id: tests
        continue-on-error: true  # the page shows failures too; the last step fails the job
        env:
          FLATMAT_BENDFM_DIR: ${{ github.workspace }}/bendfm
        run: uv run --no-sync pytest tests -q --results-page docs/test-results.md
      - name: Commit the page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/test-results.md
          # Commit only when a result changed, not just the "Run <date>, commit <sha>" line:
          # the page names the last commit whose results differ.
          if git diff --cached --quiet -I '^Run [0-9]{4}-[0-9]{2}-[0-9]{2} '; then exit 0; fi
          git commit -m "Test results for ${GITHUB_SHA::10} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Fail if the tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
