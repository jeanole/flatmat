[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "flatmat"
dynamic = ["version"]  # from src/flatmat/__init__.py
description = "Sheet metal recognition and unfolding for STEP files, on OpenCascade"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "flatmat contributors" }]
keywords = ["sheet metal", "unfold", "flat pattern", "STEP", "DXF", "OpenCascade", "CAD", "CAM"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  # OCCT bindings: OCP 8.0 (see src/flatmat/_occ.py)
  "cadquery-ocp-novtk>=8.0.1,<8.1",
  "ezdxf>=1.1,<2",
  "shapely>=2.0,<3",
  "numpy>=1.23",  # imported directly (model, fold, dfm, sequence); shapely needs it too
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.100"]
docs = ["matplotlib>=3.8"]  # tests/render_parts.py: the pictures of docs/test-results.md
dev = ["flatmat[test]", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
flatmat = "flatmat.cli:main"

[project.urls]
Source = "https://github.com/jeanole/flatmat"
Documentation = "https://github.com/jeanole/flatmat/blob/main/docs/design.md"
"Test results" = "https://github.com/jeanole/flatmat/blob/main/docs/test-results.md"
Issues = "https://github.com/jeanole/flatmat/issues"

[tool.hatch.version]
path = "src/flatmat/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flatmat"]

[tool.hatch.build.targets.sdist]
# the package, its tests with their STEP parts, and the docs; not the spike or the CI files
include = ["src/flatmat", "tests", "docs/*.md", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/flatmat"]
